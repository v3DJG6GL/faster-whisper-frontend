# Installer builds: deb + AppImage on Linux, MSI + NSIS on Windows.
#
# Forgejo Actions port of the GitHub workflow — structural changes:
#
#   * Actions unqualified — resolved via DEFAULT_ACTIONS_URL against local
#     pull mirrors; see ci.yml.
#   * windows-latest runs on the self-hosted VM runner (host mode). The job
#     inherits every ci.yml host-mode workaround (manual token checkout,
#     corepack, no setup-node) and builds with `pnpm tauri build` directly —
#     tauri-action resolves paths via $GITHUB_WORKSPACE, which the host-mode
#     runner reports as the container path /github/workspace.
#   * tauri-action is used in build-only mode (empty tagName): its release
#     path talks the GitHub releases API (octokit upload_url flow), which
#     Forgejo's API doesn't implement. Release create / asset upload /
#     publish are plain curl against the Forgejo API instead, using the
#     run-scoped actions token.
#   * `gh release edit` replaced with a curl PATCH (gh is GitHub-only).
#   * permissions: blocks dropped — GitHub token-permission model.
#   * upload-artifact -> local mirror of the Forgejo-maintained fork
#     (github's v4+ refuses non-github.com instances — never reference
#     actions/upload-artifact here, that mirrors the GitHub original).
#
#   - manual run (workflow_dispatch) → pick a version bump (patch/minor/major):
#       the version job bumps package.json + Cargo.toml/lock + tauri.conf.json via
#       scripts/version.mjs, commits "release: vX.Y.Z", tags, pushes, the build job
#       attaches the installers to a draft release, and the publish job flips it
#       live once everything uploaded. Pick "build-only" to just compile installers
#       as run artifacts (no version change, no release).
#   - push a "v*" tag by hand → same path, no version bump.
#
#   Installers are unsigned (no code-signing cert — acceptable for a FOSS tool).
#
#   NOTE: on GitHub, pushes made with the actions token never trigger other
#   workflows. Forgejo is expected to behave the same, but if a duplicate
#   release run ever appears after the version job's tag push, the
#   `concurrency: release` group queues it behind this one and the API steps
#   are idempotent (find-or-create + delete-then-upload), so it converges.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        default: patch
        options: [patch, minor, major, build-only]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bump + commit + tag (dispatch runs only, unless "build-only").
  version:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'build-only'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # persist-credentials: false — the fourth and last checkout to get it (the
      # build job got it earlier; the two manual clones strip the token by hand).
      # Otherwise the run token sits in .git/config for the whole job while the
      # two mutable-tag actions below run in this workspace, and in THIS workflow
      # that token is what creates releases and uploads installers. Both pushes
      # now carry their credential explicitly instead (see the step below).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Unlike GitHub-hosted runners, the job image has no preinstalled rust —
      # and `cargo update --workspace` below needs one.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      # Own CARGO_HOME — /root/.cargo is shared between concurrent job containers
      # on this runner and another job's rust-cache post step prunes it (full
      # story on ci.yml's step of the same name).
      - name: Per-job CARGO_HOME
        run: echo "CARGO_HOME=${RUNNER_TEMP:-/tmp}/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Bump version, commit, tag, push
        id: bump
        env:
          # Must carry write:repository (CI_TOKEN alone is checkout-scoped
          # read-only — its push 403s). Prefer a dedicated RELEASE_TOKEN so the
          # Windows VM runner's checkout token can stay least-privilege.
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.CI_TOKEN }}
          # The run-scoped actions token, previously supplied implicitly by
          # checkout's persisted header. The tag push still needs it specifically
          # (see below), so it is now passed explicitly to this one step.
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          current="$(node scripts/version.mjs)"
          IFS=. read -r MA MI PA <<< "$current"
          case "${{ inputs.bump }}" in
            major) new="$((MA+1)).0.0" ;;
            minor) new="$MA.$((MI+1)).0" ;;
            patch) new="$MA.$MI.$((PA+1))" ;;
          esac
          echo "bumping $current -> $new"
          node scripts/version.mjs "$new"
          # Sync the workspace member's entry in Cargo.lock (deps stay untouched).
          cargo update --workspace --manifest-path src-tauri/Cargo.toml
          git config user.name "forgejo-actions"
          git config user.email "forgejo-actions@noreply.localhost"
          git commit -am "release: v$new"
          git tag "v$new"
          # master is protected (2026-07-13): the run-scoped actions token gets
          # declined by the pre-receive hook as an anonymous 500 (forgejo#11159),
          # so the branch push authenticates as the repo owner via PUSH_TOKEN.
          # The tag still goes through the ACTIONS token: its push events are
          # swallowed (IsActions doer), so no duplicate release run fires.
          # Both URLs carry their credential explicitly now that checkout no
          # longer persists one — which also means the old
          # `-c http...extraheader=` overrides are gone: there is no header left
          # to clear, so neither push can send two credentials.
          # Fallback: if protection ever declines the bot's tag too, retry it as
          # the owner — that spawns a duplicate tag-push run, which the
          # `concurrency: release` group + idempotent API steps absorb. The same
          # fallback covers the case where a URL-authenticated tag push is NOT
          # attributed to the actions doer and its push event is not swallowed.
          repo_path="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          owner_url="https://${PUSH_TOKEN}@${repo_path}"
          actions_url="https://x-access-token:${ACTIONS_TOKEN}@${repo_path}"
          git push "$owner_url" "HEAD:$GITHUB_REF_NAME"
          git push "$actions_url" "v$new" \
            || git push "$owner_url" "v$new"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

  # The two build legs are split into separate jobs (the GitHub original was
  # one matrix job) because the steps diverged wholesale on the host-mode
  # Windows runner; the display names keep the original matrix-style naming.
  build:
    name: build (ubuntu-latest)
    needs: version
    # Run when version succeeded OR was skipped (tag push / build-only dispatch).
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On a bump run, build the tagged commit (not the pre-bump dispatch ref).
          ref: ${{ needs.version.outputs.tag || github.ref }}
          # Same reasoning as ci.yml's `git remote set-url` and the windows leg's: with the
          # default, checkout leaves `http.<server>/.extraheader` — the run token, base64'd — in
          # .git/config for the whole job. THIS job is the one that then runs `pnpm install`,
          # tauri-action on a mutable tag, and `cargo build` (every dependency's build.rs and
          # proc-macros) in that same workspace, and it holds release create/upload rights — so
          # build-time code that read the token could replace the installers users download.
          # This job never pushes, so it does not need the credential at all.
          persist-credentials: false

      # The release tag this run builds for — empty means build-only (artifacts).
      - name: Resolve release tag
        id: rel
        run: |
          if [ -n "${{ needs.version.outputs.tag }}" ]; then
            echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      # ci.yml's list + librsvg/patchelf/xdg-utils, which only the AppImage
      # bundling needs (tauri copies /usr/bin/xdg-open into the AppImage; the
      # act job image doesn't preinstall it like GitHub-hosted runners do).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libasound2-dev libxkbcommon-dev librsvg2-dev patchelf xdg-utils

      # Own CARGO_HOME — /root/.cargo is shared between concurrent job containers
      # on this runner; a ci.yml check finishing mid-build would otherwise prune
      # this job's cargo/bin (full story on ci.yml's step of the same name).
      - name: Per-job CARGO_HOME
        run: echo "CARGO_HOME=${RUNNER_TEMP:-/tmp}/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Don't ship a release whose tag disagrees with the in-app version readout.
      - name: Verify the tag matches the app version
        if: steps.rel.outputs.tag != ''
        run: |
          node scripts/version.mjs --check
          app="$(node scripts/version.mjs)"
          tag="${{ steps.rel.outputs.tag }}"
          if [ "$app" != "${tag#v}" ]; then
            echo "::error::tag $tag does not match app version $app — run: pnpm set-version ${tag#v}"
            exit 1
          fi

      # Build-only, always (empty tagName): the release itself is handled via
      # the Forgejo API below — tauri-action's release path is GitHub-only.
      - uses: tauri-apps/tauri-action@v1

      # Draft release + assets via the Forgejo API. Stays a draft until the
      # publish job flips it live, so a half-uploaded release is never visible.
      # Idempotent on re-runs: find-or-create the release, replace same-name
      # assets instead of erroring.
      - name: Create draft release and upload installers
        if: steps.rel.outputs.tag != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL"
          hdr="Authorization: token $TOKEN"
          rel=$(curl -sS -H "$hdr" "$api/repos/$REPO/releases/tags/$TAG")
          id=$(jq -r '.id // empty' <<<"$rel")
          if [ -z "$id" ]; then
            id=$(curl -fsS -H "$hdr" -X POST "$api/repos/$REPO/releases" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":true}" | jq -r '.id')
          fi
          echo "release id: $id"
          shopt -s nullglob
          sums=SHA256SUMS-linux.txt
          : > "$sums"
          uploaded=0
          for f in src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage; do
            name=$(basename "$f")
            # drop a stale same-name asset from a previous (re-)run
            curl -sS -H "$hdr" "$api/repos/$REPO/releases/$id/assets" \
              | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' \
              | while read -r aid; do
                  curl -fsS -H "$hdr" -X DELETE "$api/repos/$REPO/releases/$id/assets/$aid"
                done
            echo "uploading $name"
            curl -fsS -H "$hdr" -X POST \
              "$api/repos/$REPO/releases/$id/assets?name=$name" \
              -F "attachment=@$f" > /dev/null
            uploaded=$((uploaded + 1))
            # Record the digest as we go. Installers are deliberately unsigned, and the release
            # API exposes no digest of its own (verified against this instance's swagger: the
            # Attachment schema is id/name/size/uuid/created_at/download_count/url/type), so
            # without this file a downloader — and the GitHub mirror — have nothing but the byte
            # count to tell a good copy from a bad one.
            node -e 'const c=require("crypto"),f=require("fs"),p=require("path");const a=process.argv[1];console.log(c.createHash("sha256").update(f.readFileSync(a)).digest("hex")+"  "+p.basename(a))' "$f" >> "$sums"
          done
          # Each leg writes its OWN sums file: the two build jobs upload into the same draft
          # release concurrently, so a single shared name would race.
          # `shopt -s nullglob` means a glob that matches NOTHING is a silent no-op, so a
          # bundle-layout change (a tauri upgrade renaming a bundle dir, a dropped target)
          # used to leave this step green with zero installers uploaded and no SHA256SUMS
          # file — and `publish` gates only on job success, so the release went public,
          # and got mirrored, with nothing in it and no digest to verify. The sibling
          # build-only path has always asserted this via `if-no-files-found: error`; the
          # PUBLISHING path was the lenient one.
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no installer bundles matched under src-tauri/target/release/bundle — refusing to publish an empty release"
            exit 1
          fi
          if [ -s "$sums" ]; then
            sname=$(basename "$sums")
            curl -sS -H "$hdr" "$api/repos/$REPO/releases/$id/assets" \
              | jq -r --arg n "$sname" '.[] | select(.name==$n) | .id' \
              | while read -r aid; do
                  curl -fsS -H "$hdr" -X DELETE "$api/repos/$REPO/releases/$id/assets/$aid"
                done
            echo "uploading $sname"
            curl -fsS -H "$hdr" -X POST \
              "$api/repos/$REPO/releases/$id/assets?name=$sname" \
              -F "attachment=@$sums" > /dev/null
          fi

      - name: Upload installers as run artifacts (build-only run)
        if: steps.rel.outputs.tag == ''
        uses: https://forgejo.informethic.ch/forgejo/upload-artifact@v5
        with:
          name: installers-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  # Windows installers (MSI + NSIS) on the self-hosted VM runner. Runs in
  # parallel with the Linux build; both upload into the same draft release
  # (find-or-create is race-safe: a lost create just re-reads the winner's
  # release id). Steps mirror ci.yml's windows leg — see the comments there
  # for why checkout is manual, pnpm comes via corepack, and there is no
  # setup-node. WiX + NSIS are fetched by tauri itself on first use (cached
  # in the service profile's %LOCALAPPDATA%\tauri).
  windows:
    name: build (windows-latest)
    needs: version
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    runs-on: windows-latest
    steps:
      # On a bump run, build the tagged commit (not the pre-bump dispatch ref).
      # Run-scoped actions token + env indirection, same as ci.yml (see there).
      - name: Checkout
        shell: bash
        env:
          GIT_REF: ${{ needs.version.outputs.tag || github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 "https://x-access-token:${GIT_TOKEN}@forgejo.informethic.ch/${{ github.repository }}.git" "$GIT_REF"
          git checkout -q --force FETCH_HEAD

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ -n "${{ needs.version.outputs.tag }}" ]; then
            echo "tag=${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      # No rust-cache on this leg — see the fuller comment on ci.yml's step. It
      # never restored a byte here (every run: "No cache found") and its post
      # step added ~2min of invisible tail to the job: Forgejo renders no post
      # steps, so the time showed up as a gap between the last upload and
      # "Complete job". The VM's CARGO_HOME persists across jobs on its own, so
      # this build still downloads zero crates.

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the app version
        if: steps.rel.outputs.tag != ''
        shell: bash
        run: |
          node scripts/version.mjs --check
          app="$(node scripts/version.mjs)"
          tag="${{ steps.rel.outputs.tag }}"
          if [ "$app" != "${tag#v}" ]; then
            echo "::error::tag $tag does not match app version $app — run: pnpm set-version ${tag#v}"
            exit 1
          fi

      # beforeBuildCommand covers the frontend build; the linux-only bundle
      # targets in tauri.conf.json are skipped automatically on Windows.
      - name: Build installers
        run: pnpm tauri build

      # Same find-or-create + replace-assets flow as the Linux job, but JSON
      # parsing runs on node (already on the VM for JS actions) instead of jq
      # (absent from the VM).
      - name: Upload installers to the release
        if: steps.rel.outputs.tag != ''
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL"
          hdr="Authorization: token $TOKEN"
          id=$(curl -sS -H "$hdr" "$api/repos/$REPO/releases/tags/$TAG" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id ?? ""')
          if [ -z "$id" ]; then
            id=$(curl -sS -H "$hdr" -X POST "$api/repos/$REPO/releases" \
              -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":true}" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id ?? ""')
          fi
          # empty again = lost the create race to the Linux job — re-read
          if [ -z "$id" ]; then
            id=$(curl -sS -H "$hdr" "$api/repos/$REPO/releases/tags/$TAG" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id ?? ""')
          fi
          if [ -z "$id" ]; then
            echo "::error::could not resolve a release id for $TAG"
            exit 1
          fi
          echo "release id: $id"
          shopt -s nullglob
          sums=SHA256SUMS-windows.txt
          : > "$sums"
          uploaded=0
          for f in src-tauri/target/release/bundle/msi/*.msi \
                   src-tauri/target/release/bundle/nsis/*.exe; do
            name=$(basename "$f")
            # drop a stale same-name asset from a previous (re-)run
            curl -sS -H "$hdr" "$api/repos/$REPO/releases/$id/assets" \
              | node -e 'for (const a of JSON.parse(require("fs").readFileSync(0,"utf8"))) if (a.name === process.argv[1]) console.log(a.id)' "$name" \
              | while read -r aid; do
                  curl -fsS -H "$hdr" -X DELETE "$api/repos/$REPO/releases/$id/assets/$aid"
                done
            echo "uploading $name"
            curl -fsS -H "$hdr" -X POST \
              "$api/repos/$REPO/releases/$id/assets?name=$name" \
              -F "attachment=@$f" > /dev/null
            uploaded=$((uploaded + 1))
            node -e 'const c=require("crypto"),f=require("fs"),p=require("path");const a=process.argv[1];console.log(c.createHash("sha256").update(f.readFileSync(a)).digest("hex")+"  "+p.basename(a))' "$f" >> "$sums"
          done
          # `shopt -s nullglob` means a glob that matches NOTHING is a silent no-op, so a
          # bundle-layout change (a tauri upgrade renaming a bundle dir, a dropped target)
          # used to leave this step green with zero installers uploaded and no SHA256SUMS
          # file — and `publish` gates only on job success, so the release went public,
          # and got mirrored, with nothing in it and no digest to verify. The sibling
          # build-only path has always asserted this via `if-no-files-found: error`; the
          # PUBLISHING path was the lenient one.
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no installer bundles matched under src-tauri/target/release/bundle — refusing to publish an empty release"
            exit 1
          fi
          if [ -s "$sums" ]; then
            sname=$(basename "$sums")
            curl -sS -H "$hdr" "$api/repos/$REPO/releases/$id/assets" \
              | node -e 'for (const a of JSON.parse(require("fs").readFileSync(0,"utf8"))) if (a.name === process.argv[1]) console.log(a.id)' "$sname" \
              | while read -r aid; do
                  curl -fsS -H "$hdr" -X DELETE "$api/repos/$REPO/releases/$id/assets/$aid"
                done
            echo "uploading $sname"
            curl -fsS -H "$hdr" -X POST \
              "$api/repos/$REPO/releases/$id/assets?name=$sname" \
              -F "attachment=@$sums" > /dev/null
          fi

      - name: Upload installers as run artifacts (build-only run)
        if: steps.rel.outputs.tag == ''
        uses: https://forgejo.informethic.ch/forgejo/upload-artifact@v5
        with:
          name: installers-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # Flip the draft live once both builds uploaded everything — gating this in
  # a separate job keeps the release invisible until it is complete.
  publish:
    needs: [version, build, windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' && (needs.version.outputs.tag != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL"
          hdr="Authorization: token $TOKEN"
          id=$(curl -fsS -H "$hdr" "$api/repos/$REPO/releases/tags/$TAG" | jq -r '.id')
          curl -fsS -H "$hdr" -X PATCH "$api/repos/$REPO/releases/$id" \
            -H 'Content-Type: application/json' -d '{"draft": false}' > /dev/null

      # Forgejo swallows events whose actor is the actions token
      # (services/actions/notifier_helper.go: the notify() pipeline bails
      # on input.Doer.IsActions(), to avoid trigger cycles) — so the
      # publish above never fires mirror-gh-releases' `release:` trigger.
      # Dispatch it explicitly instead: the dispatch API creates the run
      # directly, same code path as the "Run workflow" button, no event
      # pipeline involved. Non-fatal: the release is already live at this
      # point, and the mirror's scheduled reconcile converges anyway.
      - name: Trigger the GitHub release mirror
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ref must name a branch carrying the workflow file — the run
          # may itself be on a tag ref, so pin the default branch.
          curl -sS --fail-with-body -X POST -H "Authorization: token $TOKEN" \
            -H 'Content-Type: application/json' \
            "$GITHUB_API_URL/repos/$REPO/actions/workflows/mirror-gh-releases.yml/dispatches" \
            -d '{"ref":"master"}' \
            || echo "::warning::mirror-gh-releases dispatch failed — the scheduled reconcile will catch up"
