# Per-push checks. Forgejo-specific notes:
#
#   * Actions are referenced unqualified (owner/repo@ref): the instance sets
#     DEFAULT_ACTIONS_URL to itself, so refs resolve against local pull
#     mirrors (orgs: actions, dtolnay, Swatinem) — no GitHub dependency
#     at job start. REQUIRES app.ini [actions] DEFAULT_ACTIONS_URL =
#     https://forgejo.informethic.ch (+ server restart): without it,
#     unqualified refs fall back to code.forgejo.org, which lacks
#     dtolnay/rust-toolchain — this job then dies at the toolchain step.
#     Before bumping any @version, confirm the mirror has synced that tag
#     (8h interval, or "Synchronize now" in repo settings).
#   * windows-latest runs on the self-hosted Windows VM runner (host mode,
#     label windows-latest:host — see the local windows-runner-setup guide).
#     Its job is the MSVC compile check: the Windows-only crates are
#     target-gated, so only a real Windows leg can catch a break there.
#
# Installer builds live in release.yml.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# The release bump push ("release: v…", see the `check` job's `if`) gets a group of its own:
# sharing the per-ref group would cancel the in-progress run of the very commit being released,
# so that commit's test suites would never run (release.yml runs none).
concurrency:
  group: "ci-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v') && 'bump' || 'check' }}"
  cancel-in-progress: true

jobs:
  check:
    # Skip the version-bump commit ("release: vX.Y.Z") that release.yml's
    # version job pushes to master as the repo owner (owner pushes DO trigger
    # workflows — only actions-token pushes are swallowed). Checking it here is
    # redundant — the release run builds that exact commit on both platforms —
    # and its windows leg would compete with the release build for the same
    # VM. An `if` instead of `[skip ci]` in the bump commit: Forgejo's skip
    # strings suppress EVERY workflow for the push event, so a hand-pushed v*
    # tag (release.yml's documented fallback path) would skip the release too.
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release: v')"
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build on the ephemeral Linux runner ONLY. The windows leg runs
        # host-mode on the self-hosted VM — no container isolation, machine-wide CARGO_HOME
        # shared with up to 5 concurrent jobs (see the rust-cache comment below), and that
        # same VM builds the release installers. `pnpm build` and `cargo check` execute
        # arbitrary third-party build-time code (vite plugins, build.rs, proc-macros), so a
        # fork PR or a Renovate bump carrying a hijacked crate must not run there.
        # Pushes to master still cover MSVC, and release.yml builds windows again before
        # anything ships — so a break surfaces at merge instead of in the PR.
        # Single-line on purpose: the whole value must be ONE expression for the matrix to
        # expand to a list. If Forgejo ever fails to evaluate it, the fallback is a second
        # job guarded by `if: github.event_name == 'push'` holding the windows steps.
        platform: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      # Manual checkout. actions/checkout persists credentials via
      # includeIf.gitdir bound to $GITHUB_WORKSPACE — but the host-mode runner
      # reports that as the container path /github/workspace while the clone
      # actually runs at the real host path, so the condition never matches,
      # the auth header is never applied, and git prompts for a username
      # (disabled) → "could not read Username". Fetching directly with the
      # run-scoped actions token sidesteps that entirely — and unlike a stored
      # PAT it is minted per run, so it cannot expire, be revoked, or be
      # affected by the owner's profile visibility. Same
      # recipe as faster-whisper-backend. Ref and token reach git through the
      # step env, not the script text: branch/tag names permit $ ( ) ` ; & |.
      # `shell: bash` so the one step is identical on the Windows leg (host-mode
      # runner defaults to pwsh, where ${VAR} is not the environment).
      - name: Checkout
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch from the credentialed URL directly instead of `git remote add`:
          # that would persist the token in .git/config, where every later step —
          # third-party actions on mutable tags, the build.rs / proc-macros / vite
          # plugins of every dependency — could read it or echo it into the log.
          git init -q .
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 "https://x-access-token:${GIT_TOKEN}@forgejo.informethic.ch/${{ github.repository }}.git" "$GIT_REF"
          git checkout -q --force FETCH_HEAD

      # The app icon exists as three byte-identical svg copies: the source of truth
      # src-tauri/icons/icon.svg, the favicon public/icon.svg (which `pnpm tauri icon`
      # does NOT regenerate) and docs/brand/icon.svg. Needs no toolchain, so Linux only
      # and before any install: a stale copy fails in seconds. See docs/brand/README.md.
      - name: Icon copies in sync
        if: runner.os == 'Linux'
        run: |
          cmp src-tauri/icons/icon.svg public/icon.svg
          cmp src-tauri/icons/icon.svg docs/brand/icon.svg

      # Linux only: setup-node downloads a node tarball and extracts it, which
      # on the host-mode Windows runner fails (bundled 7zr.exe errors extracting
      # into the SYSTEM-profile tool cache). The Windows VM already has a system
      # node installed (see the runner-setup guide), so the leg uses that.
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version-file: .nvmrc

      # pnpm via corepack, NOT pnpm/action-setup: the action's self-installer
      # invokes an unquoted node path and cmd splits it on the space in
      # "C:\Program Files\nodejs" ('C:\Program' is not recognized). corepack
      # ships with node and honours the package.json "packageManager" pin, so
      # the version stays single-sourced.
      - name: Enable pnpm
        run: corepack enable

      # webkit/gtk for tauri itself; appindicator only because tauri's
      # "tray-icon" feature links libappindicator on every target (the Linux
      # tray itself is ksni, StatusNotifierItem over D-Bus); asound for cpal;
      # xkbcommon for the Wayland virtual keyboard.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libasound2-dev libxkbcommon-dev

      # Linux only: a CARGO_HOME of this job's own. On the dind runner
      # /root/.cargo and /root/.rustup persist across job containers (every run
      # logs "existing rustup settings file" and "using existing install"), so
      # two Linux jobs running at once share one cargo/bin and one registry.
      # rust-cache's post step prunes exactly those: it deletes every binary
      # that was in cargo/bin when the job started — cargo, rustc and the other
      # rustup proxies included; on a throwaway runner that merely keeps them out
      # of the tarball — and the registry sources its own build did not use. So
      # whichever job finishes first takes `cargo` away from the other ("cargo:
      # command not found" mid-run, the moment the neighbour's post step runs).
      # RUNNER_TEMP is container-local; rustup-init and rust-cache both honour CARGO_HOME
      # (dtolnay/rust-toolchain re-exports it and puts $CARGO_HOME/bin on PATH),
      # so bin + registry come out of the cache tarball as designed and nothing
      # this job does can reach another job's cargo. RUSTUP_HOME stays shared —
      # the toolchain is read-only between stable releases, and a per-job copy
      # would re-download it every run.
      # Not on Windows: the host-mode VM shares its CARGO_HOME on purpose and
      # runs no rust-cache (see the comment below).
      - name: Per-job CARGO_HOME
        if: runner.os == 'Linux'
        run: echo "CARGO_HOME=${RUNNER_TEMP:-/tmp}/cargo-home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Formatting is platform-neutral and needs no build, so Linux only and first: a
      # formatting slip fails in seconds. Fix it with `cargo fmt` in src-tauri.
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      # Linux only. On the host-mode windows leg this action never restored anything
      # ("No cache found" / 403) while its post step spent ~2min per job tarring the
      # machine-wide CARGO_HOME + target dir — shared by up to 5 concurrent jobs on the
      # VM, so the snapshot races other writers and the save never lands. The VM's
      # CARGO_HOME persists across jobs anyway, and skipping the action also removes its
      # post-step registry pruning, which deleted crate sources mid-compile (LNK1181).
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Linux'
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # tsc + vite; tauri::generate_context! embeds dist/, so cargo needs this first.
      - run: pnpm build

      # The frontend unit suite (vitest) — platform-neutral and a few seconds,
      # so both legs run it.
      - run: pnpm test

      # clippy runs everything `cargo check` did plus the lints; any warning — compiler or
      # clippy — fails the job, on both legs (the Windows leg is the only place the
      # cfg(windows) code gets linted). --all-targets covers the test modules too.
      # The toolchain floats on stable, so a new Rust release can bring a new lint: fix
      # it, or allow it with a reason where it fires.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      # The unit tests live mostly in Linux-gated modules; the Windows leg's job
      # is the compile check above.
      - name: cargo test
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # Advisory scan of the Rust tree — where the network stack (reqwest/rustls,
      # tokio-tungstenite), the clipboard, keystroke synthesis and the OS keyring live, and the
      # half of the dependency graph `pnpm audit` cannot see. Linux only: Cargo.lock is
      # platform-independent, so a second run on Windows would scan the same lockfile.
      # Accepted advisories (with reasons) live in src-tauri/.cargo/audit.toml — a NEW one on a
      # crate that actually handles untrusted bytes should fail this job.
      - name: cargo audit
        if: runner.os == 'Linux'
        # Run from src-tauri: cargo-audit resolves .cargo/audit.toml relative to the working
        # directory, so invoking it from the repo root would silently ignore the accepted-advisory
        # list and fail the build on entries we have already decided about.
        working-directory: src-tauri
        env:
          # Pinned so a run compiles a KNOWN cargo-audit rather than whatever crates.io calls
          # latest at that moment — `--locked` pins its dependencies, not the tool itself, and the
          # install runs the tool's own build scripts and proc-macros on the runner (then
          # rust-cache keeps the binary for later runs). Renovate bumps this line; the
          # `datasource`/`depName` comment below is what tells it where to look.
          # renovate: datasource=crate depName=cargo-audit
          CARGO_AUDIT_VERSION: "0.22.2"
        run: |
          # Re-install when the cached binary is a different version from the pin, not merely when
          # none is present — otherwise a stale cached build outlives every bump.
          # `|| true`: on a cold cache `cargo audit` is not installed and exits 101 — the runner's
          # `bash -e -o pipefail` would otherwise kill the whole step right here, silently
          # (stderr is discarded), instead of falling through to the install.
          have=$(cargo audit --version 2>/dev/null | awk '{print $NF}' || true)
          if [ "$have" != "$CARGO_AUDIT_VERSION" ]; then
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --force
          fi
          cargo audit
