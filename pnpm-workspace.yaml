# pnpm 11 turns "a dependency wanted to run an install script and we ignored it"
# from a warning into a hard error (ERR_PNPM_IGNORED_BUILDS), so every such
# package has to be answered for explicitly or `pnpm install` exits 1.
#
# esbuild (transitive, via vite) is the only one. Its postinstall just resolves
# the platform binary that the @esbuild/* optionalDependencies already provide,
# and CI has been building green on Linux and Windows with this script ignored
# since pnpm 10 started skipping it by default -- so deny it rather than approve
# it, and keep the lifecycle script switched off.
#
# The setting was `onlyBuiltDependencies` (a list) in pnpm 10 and is `allowBuilds`
# (a map) since pnpm 11. package.json pins pnpm 12 ("packageManager"), which reads
# it; pnpm 10 would silently ignore the key.
allowBuilds:
  esbuild: false

# Release-age cooldown (minutes): 3 days, the same as Renovate's minimumReleaseAge.
# Renovate's gate only covers the direct dependencies it bumps; lock file
# maintenance hands resolution to pnpm, so transitive versions are picked here
# (Renovate docs: set the age in both places). Renovate PRs, security fixes
# included, already wait 3 days, so `--frozen-lockfile` on CI never meets a
# younger version -- vite@8.1.4 went red under pnpm 11's 1-day default only
# because bumps then landed same-day. An urgent exception goes in
# `minimumReleaseAgeExclude`.
minimumReleaseAge: 4320
